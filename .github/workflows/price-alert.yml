name: Price alert checker

on:
  schedule:
    # Every 5 minutes (UTC), GitHub's minimum. GitHub may start scheduled runs late, or skip them under heavy load.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: check
        options:
          - check           # normal run
          - dry-run         # evaluate only: no writes, no email
          - test-email      # send one test email

# Least privilege: the job only needs to read the repository code.
permissions:
  contents: read

# Never run two checks at the same time (the API also guards against duplicates).
concurrency:
  group: price-alert-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run alert checker
        env:
          ALERTS_API_URL: ${{ secrets.ALERTS_API_URL }}
          CHECKER_TOKEN: ${{ secrets.CHECKER_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAX_NOTIFICATION_ATTEMPTS: "5"
          MODE: ${{ inputs.mode || 'check' }}
          EVENT: ${{ github.event_name }}
        run: |
          # Until the secrets are added (README Step 6), scheduled runs skip instead of failing every 5 minutes.
          if [ "$EVENT" = "schedule" ] && { [ -z "$ALERTS_API_URL" ] || [ -z "$SMTP_PASSWORD" ]; }; then
            echo "::warning::Checker not configured yet (ALERTS_API_URL / SMTP secrets missing). Skipping."
            exit 0
          fi
          case "$MODE" in
            check)          python -m backend.check_prices ;;
            dry-run)        python -m backend.check_prices --dry-run ;;
            test-email)     python -m backend.check_prices --test-email ;;
            *) echo "Unknown mode"; exit 1 ;;
          esac
