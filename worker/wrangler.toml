# Cloudflare Worker configuration for the alert storage API.
# See README.md -> "Step 4: Deploy the alert storage API".
name = "binance-price-alert"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of web origins allowed to call the API from a browser.
# Example: "https://your-github-username.github.io"
# Do NOT add a path (no "/binance-price-alert" suffix) - an origin is scheme + host only.
ALLOWED_ORIGINS = "https://ravindu-bhagya.github.io"
# Repository whose "Price alert checker" workflow the cron trigger starts.
GITHUB_REPO = "Ravindu-Bhagya/currency_value_alert"

# Reliable timer (GitHub's own schedule is often late or skipped): every 2 minutes,
# the Worker starts the checker workflow when there are active alerts.
# Needs the secret GITHUB_DISPATCH_TOKEN: a fine-grained token for this repository
# with "Actions: Read and write" only.  npx wrangler secret put GITHUB_DISPATCH_TOKEN
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "binance-alerts"
# Replace with the database_id printed by: npx wrangler d1 create binance-alerts
database_id = "11b9ecd7-9b91-44fd-a7a6-665306cdfb8d"

# Secrets (never put them in this file). Set them with:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put CHECKER_TOKEN
